site_name: DAGGERHEART SRD (Bilingual EN/PT-BR)
site_url: https://dirodgit.github.io/daggerheart-srd-ptbr/
repo_url: https://github.com/dirodgit/daggerheart-srd-ptbr
theme:
  name: material
  language: pt-BR
  palette:
    scheme: slate
    primary: red
    accent: red
  favicon: favicon.png
  logo: favicon.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight

